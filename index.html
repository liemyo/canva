<!doctype html>
<html lang="id" data-theme="light" data-accent="violet" data-glass="liquid" data-bg="aurora" data-canvas="soft">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amatu Design — desain grafis online</title>
<meta name="description" content="Amatu Design: buat desain media sosial, presentasi, poster, logo, dan dokumen langsung di browser — dengan template, foto, ikon, efek teks, animasi, hapus latar AI, dan ekspor PNG/PDF/PPTX.">
<meta name="theme-color" content="#f1eefb">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,300..500,0..1,0&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/editor.css">
<script>
(function(){try{var p=JSON.parse(localStorage.getItem('adesign.ui')||'{}'),m=p.mode||'system',r=document.documentElement,
d=m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
r.dataset.theme=d?'dark':'light';r.dataset.accent=p.accent||'violet';r.dataset.glass=p.glass||'liquid';r.dataset.bg=p.bg||'aurora';r.dataset.canvas=p.canvas||'soft';
if(window.chrome)r.classList.add('can-refract')}catch(e){}})();
</script>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div id="app"></div>
<noscript><p style="padding:40px;font:16px system-ui">Amatu Design memerlukan JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
